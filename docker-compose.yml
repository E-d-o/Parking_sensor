
services:
  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    volumes:
      # grafana data
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

    

    environment:
      - GF_SECURITY_ADMIN_USER=$GRAFANA_ADMIN_USER
      - GF_SECURITY_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
      - INFLUXDB_ORG=$INFLUXDB_ORG
      - INFLUXDB_TOKEN=$INFLUXDB_TOKEN
      - INFLUXDB_BUCKET=$INFLUXDB_BUCKET

      
    depends_on:
      influxdb:
        condition: service_healthy


  influxdb:
    image: influxdb:2.8.0
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: $INFLUXDB_INIT_USERNAME
      DOCKER_INFLUXDB_INIT_PASSWORD: $INFLUXDB_INIT_PASSWORD 
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: $INFLUXDB_TOKEN
      DOCKER_INFLUXDB_INIT_ORG: $INFLUXDB_ORG
      DOCKER_INFLUXDB_INIT_BUCKET: $INFLUXDB_BUCKET

   
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "influx ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s



  sensor_script:
    build:
      context: .
      dockerfile: Dockerfile 
    container_name: sensor_script
    privileged: true  # accesso root per pin GPIO
    devices: # accesso ai dispositivi GPIO
    - /dev/gpiomem:/dev/gpiomem
    restart: unless-stopped
    volumes:
      - ./src/:/app/src  
    environment:

      - PYTHONUNBUFFERED=1 #per avere print nei logs in tempo reale, non buffered
      - INFLUXDB_URL=$INFLUXDB_URL
      - INFLUXDB_ORG=$INFLUXDB_ORG
      - INFLUXDB_TOKEN=$INFLUXDB_TOKEN
      - INFLUXDB_BUCKET=$INFLUXDB_BUCKET
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  grafana-storage:
    driver: local 
  influxdb2-data:
  influxdb2-config:


