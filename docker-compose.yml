
services:
  grafana:
    image: grafana/grafana:12.3
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    
    volumes:
      # grafana data
      - grafana-storage:/var/lib/grafana

  influxdb:
    image: influxdb:2.8.0
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"


    
    volumes:
      - influxdb-data:/var/lib/influxdb2      

volumes:
  grafana-storage:
    driver: local 
  influxdb-data:
    driver: local


