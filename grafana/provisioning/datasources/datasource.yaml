
apiVersion: 1

prune: true

datasources:
  - name: influxdb
    type: influxdb
    access: proxy
    uid: influxdb-uid
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: $INFLUXDB_ORG
      defaultBucket: $INFLUXDB_BUCKET
      tlsSkipVerify: true
    secureJsonData:
      token: $INFLUXDB_TOKEN